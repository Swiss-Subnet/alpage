name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: actions/cache@v5.0.5
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Cache Go
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Warm devShell
        run: nix develop --command true

      # Cached fixed-output derivations, same as CI.
      - name: Generate code
        run: |
          set -euo pipefail
          cp -r "$(nix build --no-link --print-out-paths .#genBindings)" gen
          cp -r "$(nix build --no-link --print-out-paths .#genProto)" nns/pb
          chmod -R u+w gen nns/pb

      # Cross-compile alp for each target with the tag injected into main.version.
      # CGO is off so the binaries are static and cross-compilation needs no C
      # toolchain. Release artifacts are cross-compiled here (one runner, four
      # platforms); the flake's packages.alp is the reproducible host build for
      # `nix build` / `nix run`. Both share the purego tag (see flake.nix) so the
      # gnark-crypto asm include problem does not bite either path.
      #
      # Each platform ships twice: a .tar.gz carrying the binary alongside the
      # licence texts and docs (so a BUSL-licensed binary never travels without
      # its terms), and the bare binary for `curl | chmod +x` installs. Both are
      # checksummed.
      - name: Build release binaries
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            TAG="${GITHUB_REF_NAME}"
            mkdir -p dist
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
              GOOS="${target%/*}"; GOARCH="${target#*/}"
              name="alp-${TAG}-${GOOS}-${GOARCH}"
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                go build -tags purego -trimpath -ldflags "-s -w -X main.version=${TAG}" \
                -o "dist/${name}" ./cmd/alp

              # Staged under the tarball name so it unpacks into its own directory.
              stage="$(mktemp -d)/${name}"
              mkdir -p "$stage/docs"
              cp "dist/${name}" "$stage/alp"
              cp LICENSE NOTICE THIRD_PARTY_LICENSES CHANGELOG.md "$stage/"
              cp docs/config.md docs/licensing.md "$stage/docs/"
              tar -czf "dist/${name}.tar.gz" -C "$(dirname "$stage")" "${name}"

              (cd dist && sha256sum "${name}" > "${name}.sha256")
              (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
            done
          '

      # Notes are the tag's CHANGELOG.md section followed by the licensing block.
      # A tag with no section fails the release rather than publishing empty
      # notes.
      - name: Build release notes
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one. Written
          # outside dist/ so it is not picked up as a release asset.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/section.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/section.md"; then
            echo "::error::CHANGELOG.md has no section for [$version]; add one before tagging"
            exit 1
          fi
          cp "$RUNNER_TEMP/section.md" dist/RELEASE_NOTES.md

      # BUSL-1.1 sets the Change Date per version, four years after that version
      # is published. Record both dates in the release notes so each version's
      # clock is auditable from the release itself.
      - name: Append license notes
        run: |
          set -euo pipefail
          published="$(date -u +%Y-%m-%d)"
          change="$(date -u -d '+4 years' +%Y-%m-%d)"
          cat >> dist/RELEASE_NOTES.md <<EOF
          ## Licensing

          Alpage is (c) 2026 Swiss Subnet AG and licensed under the Business Source License 1.1 (see LICENSE).

          - Published: ${published}
          - Change Date: ${change} (this version converts to Apache License 2.0)

          Running Alpage against your own fleet of up to 5 nodes is free, including in production; evaluation and testing are free at any fleet size. Beyond 5 nodes, managing fleets for third parties, or offering a hosted service built on Alpage needs a commercial licence: see docs/licensing.md or contact licensing@subnet.ch.
          EOF
          cat dist/RELEASE_NOTES.md

      # Assets are listed explicitly rather than globbed, so a stray file in
      # dist/ cannot become a release artifact. --notes-file supplies the
      # changelog section and licensing block; --generate-notes appends the
      # commit list below them.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=()
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            name="alp-${GITHUB_REF_NAME}-${target%/*}-${target#*/}"
            assets+=("dist/${name}" "dist/${name}.sha256")
            assets+=("dist/${name}.tar.gz" "dist/${name}.tar.gz.sha256")
          done
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --generate-notes --notes-file dist/RELEASE_NOTES.md --verify-tag
